openapi: 3.0.3
info:
  title: Cinema Management System (CMS) RESTful API
  version: 1.0.0
  description: |
    Tài liệu chuẩn OpenAPI 3.0 cho hệ thống quản lý cụm rạp chiếu phim và đặt vé trực tuyến (CMS).
    Múi giờ: Asia/Ho_Chi_Minh (UTC+7). Tiền tệ: VNĐ (Decimal).
servers:
  - url: http://localhost:4000/api
    description: Development Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập hệ thống và nhận JWT Access/Refresh Token
      responses:
        '200':
          description: Đăng nhập thành công
  /movies:
    get:
      tags: [Movies]
      summary: Danh sách phim có phân trang, tìm kiếm, lọc theo thể loại/trạng thái/độ tuổi
      responses:
        '200':
          description: Danh sách phim
    post:
      tags: [Movies]
      security: [{ bearerAuth: [] }]
      summary: Thêm phim mới (Yêu cầu ADMIN hoặc MANAGER)
      responses:
        '201':
          description: Tạo phim thành công
  /auditoriums:
    get:
      tags: [Auditoriums]
      security: [{ bearerAuth: [] }]
      summary: Danh sách phòng chiếu và cấu hình sơ đồ ghế
      responses:
        '200':
          description: Danh sách phòng chiếu
    put:
      tags: [Auditoriums]
      security: [{ bearerAuth: [] }]
      summary: Cập nhật sơ đồ ghế (Chặn thay đổi nếu phòng đã có vé phát sinh)
      responses:
        '200':
          description: Cập nhật thành công
        '409':
          description: Không thể đổi cấu trúc phòng khi đã có vé bán
  /showtimes:
    post:
      tags: [Showtimes]
      security: [{ bearerAuth: [] }]
      summary: Tạo suất chiếu mới (Tự động kiểm tra xung đột giờ chiếu + thời gian vệ sinh phòng)
      responses:
        '201':
          description: Tạo suất chiếu thành công
        '409':
          description: Xung đột lịch chiếu trong cùng phòng
  /bookings/hold-seats:
    post:
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      summary: Giữ ghế tạm thời 5 phút với cơ chế khóa Transaction Serializable
      responses:
        '200':
          description: Giữ ghế thành công
        '409':
          description: Ghế đã bán hoặc đang được người khác giữ
  /bookings:
    post:
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      summary: Tạo đơn đặt vé và kiểm tra mã khuyến mãi tại Backend
      responses:
        '201':
          description: Đơn hàng được khởi tạo
  /payments/webhook:
    post:
      tags: [Payments]
      summary: Xác nhận callback thanh toán (Xác minh chữ ký HMAC-SHA256 & chống lặp Idempotency)
      responses:
        '200':
          description: Xử lý thanh toán thành công
  /refunds:
    post:
      tags: [Refunds]
      security: [{ bearerAuth: [] }]
      summary: Hủy vé, hoàn tiền theo chính sách và giải phóng ghế
      responses:
        '200':
          description: Hoàn tiền thành công
  /reports/revenue:
    get:
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      summary: Báo cáo doanh thu gộp, hoàn tiền, doanh thu thuần và tỷ lệ lấp đầy ghế
      responses:
        '200':
          description: Dữ liệu báo cáo tổng hợp
